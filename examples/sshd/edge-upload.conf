# Edge Bridge: sshd settings for the upload-only SFTP account.
#
# Install as /etc/ssh/sshd_config.d/10-edge-upload.conf. The "10-" matters: sshd
# keeps the first value it reads, so this file must sort before any distro file
# (for example 50-cloud-init.conf) that turns passwords back on.
#
# BEFORE YOU RELOAD:
#   1. Replace "admin" with your own admin login. If you leave AllowUsers wrong,
#      you lock yourself out.
#   2. Replace 203.0.113.10 with the address Edge uploads from.
#   3. Keep a second SSH session open. Test with: sudo sshd -t
#      Then reload: sudo systemctl reload ssh   (the service is "sshd" on some distros)
#
# Needs OpenSSH 8.7 or newer for the name KbdInteractiveAuthentication
# (older versions call it ChallengeResponseAuthentication).

# Everyone: SSH keys only, no root login, no forwarding. Stops password guessing.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
X11Forwarding no

# Only these logins exist. The upload account only from Edge's address.
AllowUsers admin edge-upload@203.0.113.10

# The one account that may use a password: locked into one folder, SFTP only.
# Keep this block last in the file. A Match block runs to the next Match or the end.
Match User edge-upload
    PasswordAuthentication yes
    # To use a key instead of a password, set the line above to "no" and add:
    # AuthorizedKeysFile /etc/ssh/edt-upload.authorized_keys
    ChrootDirectory /srv/edt/sftp
    # Start in /inbox. -u 027 makes uploaded files readable by the group
    # "edge-upload" (the bridge user is a member) and by nobody else.
    ForceCommand internal-sftp -d /inbox -u 027
    PermitTTY no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    X11Forwarding no
